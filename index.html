<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --read: #22c55e;
      --not-read: #ef4444;
      --default: #334155;
      --accent: #60a5fa;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 22px;
    }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 10px 14px;
      background: rgba(17,24,39,.75);
      border: 1px solid #334155;
      border-radius: 12px;
      width: fit-content;
    }

    .legend-item { display: flex; align-items: center; gap: 8px; color: #cbd5e1; }
    .dot-preview {
      width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25);
    }

    .months {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .month {
      background: linear-gradient(180deg, rgba(30,41,59,.7), rgba(15,23,42,.75));
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }

    .month h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      letter-spacing: .2px;
      color: #dbeafe;
    }

    .weeks {
      display: grid;
      gap: 8px;
    }

    .week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day-dot {
      width: 100%;
      aspect-ratio: 1;
      border: none;
      border-radius: 50%;
      background: var(--default);
      cursor: pointer;
      transition: transform .08s ease, filter .2s ease;
      position: relative;
    }

    .day-dot:hover { transform: scale(1.06); filter: brightness(1.2); }
    .day-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .state-default { background: var(--default); }
    .state-read { background: var(--read); }
    .state-not-read { background: var(--not-read); }

    .hint {
      margin-top: 18px;
      color: #cbd5e1;
      font-size: .92rem;
    }

    .hint kbd {
      background: #1f2937;
      border: 1px solid #374151;
      border-bottom-color: #4b5563;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Modern Reading Tracker</h1>
    <p class="subtitle">12 months • 4 weeks per month • 7 day dots per week</p>

    <div class="legend" aria-label="Status legend">
      <div class="legend-item"><span class="dot-preview" style="background: var(--read)"></span> Read</div>
      <div class="legend-item"><span class="dot-preview" style="background: var(--not-read)"></span> Didn't Read</div>
      <div class="legend-item"><span class="dot-preview" style="background: var(--default)"></span> Default</div>
    </div>

    <div class="months" id="months"></div>

    <p class="hint">Click a dot to cycle: <kbd>Default</kbd> → <kbd>Read</kbd> → <kbd>Didn't Read</kbd> → <kbd>Default</kbd>.</p>
  </div>

  <script>
    const months = [
      'January','February','March','April','May','June',
      'July','August','September','October','November','December'
    ];

    const states = ['default', 'read', 'not-read'];

    function nextState(current) {
      const idx = states.indexOf(current);
      return states[(idx + 1) % states.length];
    }

    function labelForState(state) {
      if (state === 'read') return 'Read';
      if (state === 'not-read') return "Didn't Read";
      return 'Default';
    }

    function createDot(monthIndex, weekIndex, dayIndex) {
      const btn = document.createElement('button');
      btn.className = 'day-dot state-default';
      btn.dataset.state = 'default';
      btn.type = 'button';
      btn.title = `${months[monthIndex]} • Week ${weekIndex + 1} • Day ${dayIndex + 1} • Default`;
      btn.setAttribute('aria-label', btn.title);

      btn.addEventListener('click', () => {
        const newState = nextState(btn.dataset.state);
        btn.dataset.state = newState;
        btn.classList.remove('state-default', 'state-read', 'state-not-read');
        btn.classList.add(`state-${newState}`);

        const label = labelForState(newState);
        btn.title = `${months[monthIndex]} • Week ${weekIndex + 1} • Day ${dayIndex + 1} • ${label}`;
        btn.setAttribute('aria-label', btn.title);
      });

      return btn;
    }

    function buildTracker() {
      const root = document.getElementById('months');

      months.forEach((month, monthIndex) => {
        const monthCard = document.createElement('section');
        monthCard.className = 'month';

        const title = document.createElement('h2');
        title.textContent = month;
        monthCard.appendChild(title);

        const weeks = document.createElement('div');
        weeks.className = 'weeks';

        for (let w = 0; w < 4; w++) {
          const week = document.createElement('div');
          week.className = 'week';
          for (let d = 0; d < 7; d++) {
            week.appendChild(createDot(monthIndex, w, d));
          }
          weeks.appendChild(week);
        }

        monthCard.appendChild(weeks);
        root.appendChild(monthCard);
      });
    }

    buildTracker();
  </script>
</body>
</html>
